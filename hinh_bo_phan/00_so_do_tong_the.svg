<rect x="652" y="104" width="276" height="478" rx="10" fill="#FFFFFF" stroke="#D0D8DF"/>
<text x="668" y="132" font-size="11" font-weight="700" letter-spacing="1.2" fill="#5A6775">BA VÒNG + MỘT HỘP</text>
<text x="668" y="150" font-size="12.5" fill="#15212C">Vòng gas lạnh làm lạnh cabin (qua dàn</text>
<text x="668" y="166" font-size="12.5" fill="#15212C">lạnh) và pin (qua chiller). Vòng nước</text>
<text x="668" y="182" font-size="12.5" fill="#15212C">pin giữ pin 20–40°C. Vòng nước motor</text>
<text x="668" y="198" font-size="12.5" fill="#15212C">thải nhiệt motor, inverter, OBC, DC-DC</text>
<text x="668" y="214" font-size="12.5" fill="#15212C">ra két nước. Hộp HVAC đưa gió đã làm</text>
<text x="668" y="230" font-size="12.5" fill="#15212C">lạnh / sưởi vào cabin.</text>
<text x="668" y="260" font-size="11" font-weight="700" letter-spacing="1.2" fill="#5A6775">HAI CẦU NỐI</text>
<text x="680" y="278" font-size="12.5" fill="#15212C">Chiller: gas lạnh làm lạnh nước của</text>
<circle cx="672" cy="274" r="2.2" fill="#E2552F"/>
<text x="680" y="294" font-size="12.5" fill="#15212C">pin</text>
<text x="680" y="312" font-size="12.5" fill="#15212C">Van chia nước: nối vòng motor sang</text>
<circle cx="672" cy="308" r="2.2" fill="#E2552F"/>
<text x="680" y="328" font-size="12.5" fill="#15212C">vòng pin để tận dụng nhiệt</text>
<text x="668" y="358" font-size="11" font-weight="700" letter-spacing="1.2" fill="#5A6775">ĐIỀU KHIỂN</text>
<text x="668" y="376" font-size="12.5" fill="#15212C">VCU, BMS, CCU đọc cảm biến và bật /</text>
<text x="668" y="392" font-size="12.5" fill="#15212C">tắt máy nén, van, bơm, quạt, PTC.</text>
