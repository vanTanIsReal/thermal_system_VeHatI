<text x="668" y="132" font-size="11" font-weight="700" letter-spacing="1.2" fill="#5A6775">CHỨC NĂNG</text>
<text x="668" y="150" font-size="12.5" fill="#15212C">Hút gió qua dàn nóng và két nước khi</text>
<text x="668" y="166" font-size="12.5" fill="#15212C">xe chạy chậm hoặc đứng yên (đang sạc).</text>
<text x="668" y="182" font-size="12.5" fill="#15212C">Dùng chung cho vòng gas và vòng nước</text>
