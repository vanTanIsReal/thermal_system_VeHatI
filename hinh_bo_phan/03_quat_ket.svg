<text x="668" y="378" font-size="11" font-weight="700" letter-spacing="1.2" fill="#5A6775">KHI HỎNG</text>
<text x="668" y="396" font-size="12.5" fill="#15212C">Điều hòa yếu khi xe đứng, chiller yếu</text>
