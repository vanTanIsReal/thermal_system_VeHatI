<rect x="652" y="104" width="276" height="478" rx="10" fill="#FFFFFF" stroke="#D0D8DF"/>
<text x="668" y="132" font-size="11" font-weight="700" letter-spacing="1.2" fill="#5A6775">CHỨC NĂNG</text>
<text x="668" y="150" font-size="12.5" fill="#15212C">Đo nhiệt nước, gió, cell, motor… bằng</text>
<text x="668" y="166" font-size="12.5" fill="#15212C">điện trở NTC. Xe có hàng chục cảm</text>
<text x="668" y="182" font-size="12.5" fill="#15212C">biến; mọi quyết định bật / tắt của hệ</text>
<text x="668" y="198" font-size="12.5" fill="#15212C">nhiệt dựa vào chúng.</text>
<text x="668" y="228" font-size="11" font-weight="700" letter-spacing="1.2" fill="#5A6775">HAY HỎNG</text>
<text x="680" y="246" font-size="12.5" fill="#15212C">Trôi / lệch dần (drift, offset)</text>
<circle cx="672" cy="242" r="2.2" fill="#E2552F"/>
<text x="680" y="264" font-size="12.5" fill="#15212C">Đứng giá trị (stuck)</text>
<circle cx="672" cy="260" r="2.2" fill="#E2552F"/>
<text x="680" y="282" font-size="12.5" fill="#15212C">Chân cắm ăn mòn → nhiễu</text>
<circle cx="672" cy="278" r="2.2" fill="#E2552F"/>
<text x="668" y="312" font-size="11" font-weight="700" letter-spacing="1.2" fill="#5A6775">TELEMETRY</text>
<text x="680" y="330" font-size="12.5" fill="#15212C">Nhiệt nước vào / ra pin, cell,</text>
<circle cx="672" cy="326" r="2.2" fill="#E2552F"/>
<text x="680" y="346" font-size="12.5" fill="#15212C">motor, EDS, dàn lạnh, cabin, ngoài</text>
<text x="680" y="362" font-size="12.5" fill="#15212C">trời</text>
<text x="680" y="380" font-size="12.5" fill="#15212C">Cờ lỗi cảm biến: VCU Tsen, BMS, EDS</text>
<circle cx="672" cy="376" r="2.2" fill="#E2552F"/>
<text x="668" y="410" font-size="11" font-weight="700" letter-spacing="1.2" fill="#5A6775">KHI HỎNG</text>
<text x="668" y="428" font-size="12.5" fill="#15212C">Bộ điều khiển và thuật toán phía sau</text>
<text x="668" y="444" font-size="12.5" fill="#15212C">kết luận sai → lọc cảm biến trước.</text>
<rect x="32" y="596" width="18" height="6" rx="3" fill="#C2418A"/><text x="56" y="603" font-size="12" fill="#5A6775">Tín hiệu / CAN</text>
