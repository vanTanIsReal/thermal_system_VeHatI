<text x="668" y="280" font-size="11" font-weight="700" letter-spacing="1.2" fill="#5A6775">TELEMETRY</text>
<text x="680" y="298" font-size="12.5" fill="#15212C">Gián tiếp: cờ thiếu nước, rò nước</text>
