<text x="680" y="332" font-size="12.5" fill="#15212C">dần</text>
<text x="668" y="362" font-size="11" font-weight="700" letter-spacing="1.2" fill="#5A6775">GHI CHÚ</text>
<text x="668" y="380" font-size="12.5" fill="#15212C">Telemetry không chỉ ra được chỗ hở</text>
<text x="668" y="396" font-size="12.5" fill="#15212C">chính xác — xưởng phải dò.</text>
