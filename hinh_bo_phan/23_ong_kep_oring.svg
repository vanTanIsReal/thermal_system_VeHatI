<text x="668" y="132" font-size="11" font-weight="700" letter-spacing="1.2" fill="#5A6775">CHỨC NĂNG</text>
<text x="668" y="150" font-size="12.5" fill="#15212C">Ống, kẹp, đầu nối nhanh và O-ring nối</text>
<text x="668" y="166" font-size="12.5" fill="#15212C">mọi bộ phận của vòng nước và vòng gas.</text>
