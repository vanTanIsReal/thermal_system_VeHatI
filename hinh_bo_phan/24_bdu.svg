<text x="668" y="132" font-size="11" font-weight="700" letter-spacing="1.2" fill="#5A6775">CHỨC NĂNG</text>
<text x="668" y="150" font-size="12.5" fill="#15212C">Hộp ngắt điện cao áp trong pin: đóng /</text>
<text x="668" y="166" font-size="12.5" fill="#15212C">ngắt pin với xe, chứa contactor, cầu</text>
<text x="668" y="182" font-size="12.5" fill="#15212C">chì, cảm biến dòng. Dòng lớn khi sạc</text>
<text x="668" y="198" font-size="12.5" fill="#15212C">nhanh làm BDU nóng.</text>
<text x="668" y="228" font-size="11" font-weight="700" letter-spacing="1.2" fill="#5A6775">HAY HỎNG</text>
<text x="680" y="246" font-size="12.5" fill="#15212C">Tiếp điểm contactor nóng / hàn dính</text>
<circle cx="672" cy="242" r="2.2" fill="#E2552F"/>
<text x="680" y="264" font-size="12.5" fill="#15212C">Mối nối lỏng → nóng cục bộ</text>
<circle cx="672" cy="260" r="2.2" fill="#E2552F"/>
<text x="668" y="294" font-size="11" font-weight="700" letter-spacing="1.2" fill="#5A6775">TELEMETRY</text>
<text x="680" y="312" font-size="12.5" fill="#15212C">BDU Temperature</text>
<circle cx="672" cy="308" r="2.2" fill="#E2552F"/>
<text x="680" y="330" font-size="12.5" fill="#15212C">BDU temperature warning, BDU hot</text>
<circle cx="672" cy="326" r="2.2" fill="#E2552F"/>
<text x="668" y="360" font-size="11" font-weight="700" letter-spacing="1.2" fill="#5A6775">NGUỒN</text>
<text x="668" y="378" font-size="12.5" fill="#15212C">VF 5: trong vỏ pin có BDU+, BDU−, cầu</text>
<text x="668" y="394" font-size="12.5" fill="#15212C">chì chính, cầu chì nổ (VATC).</text>
<rect x="32" y="596" width="18" height="6" rx="3" fill="#F07A1A"/><text x="56" y="603" font-size="12" fill="#5A6775">Điện cao áp</text>
