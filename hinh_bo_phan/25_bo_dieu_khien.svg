<rect x="652" y="104" width="276" height="478" rx="10" fill="#FFFFFF" stroke="#D0D8DF"/>
<text x="668" y="132" font-size="11" font-weight="700" letter-spacing="1.2" fill="#5A6775">CHỨC NĂNG</text>
<text x="668" y="150" font-size="12.5" fill="#15212C">Cảm biến → ECU đọc, lọc, tạo cờ → mạng</text>
<text x="668" y="166" font-size="12.5" fill="#15212C">CAN → gateway XGW → T-Box gửi lên</text>
<text x="668" y="182" font-size="12.5" fill="#15212C">server. Telemetry chỉ có những trường</text>
<text x="668" y="198" font-size="12.5" fill="#15212C">T-Box được cấu hình gửi.</text>
<text x="668" y="228" font-size="11" font-weight="700" letter-spacing="1.2" fill="#5A6775">HAY HỎNG</text>
<text x="680" y="246" font-size="12.5" fill="#15212C">Mất giao tiếp (lost communication)</text>
<circle cx="672" cy="242" r="2.2" fill="#E2552F"/>
<text x="680" y="264" font-size="12.5" fill="#15212C">Phần mềm / hiệu chuẩn sai</text>
<circle cx="672" cy="260" r="2.2" fill="#E2552F"/>
<text x="668" y="294" font-size="11" font-weight="700" letter-spacing="1.2" fill="#5A6775">TELEMETRY</text>
<text x="680" y="312" font-size="12.5" fill="#15212C">Telltale mất giao tiếp CCU, VCU, BMS</text>
<circle cx="672" cy="308" r="2.2" fill="#E2552F"/>
<text x="680" y="330" font-size="12.5" fill="#15212C">VCU … component error level</text>
<circle cx="672" cy="326" r="2.2" fill="#E2552F"/>
<text x="668" y="360" font-size="11" font-weight="700" letter-spacing="1.2" fill="#5A6775">NGUỒN</text>
<text x="668" y="378" font-size="12.5" fill="#15212C">VinFast: hệ nhiệt hiệu chuẩn qua VCU</text>
<text x="668" y="394" font-size="12.5" fill="#15212C">và CCU; VF 8 mới dùng máy tính trung</text>
<text x="668" y="410" font-size="12.5" fill="#15212C">tâm CVC.</text>
<rect x="32" y="596" width="18" height="6" rx="3" fill="#C2418A"/><text x="56" y="603" font-size="12" fill="#5A6775">Tín hiệu / CAN</text>
<text x="928" y="620" font-size="11" fill="#5A6775" text-anchor="end">Hình minh họa kỹ thuật chung — không theo bản vẽ VinFast</text>
